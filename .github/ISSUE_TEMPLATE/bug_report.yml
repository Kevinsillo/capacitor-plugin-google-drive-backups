name: Bug report
description: Report a problem with the plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This plugin is maintained on a best-effort basis, so a complete report helps us fix it faster.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: capacitor-version
    attributes:
      label: Capacitor version
      placeholder: "8.x"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android (native)
        - Web (browser)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that reproduces the problem.
      render: typescript
  - type: input
    id: error-code
    attributes:
      label: Error code
      description: The code from the error event or rejection, for example `space.002`.
      placeholder: "space.002"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run `configure({ logLevel: 'debug' })`, reproduce the problem, and paste the `log` events here."
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the README and the error code catalog.
          required: true
        - label: I searched the existing issues.
          required: true
