name: Feature request
description: Suggest a change or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do that the plugin does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you would like to call it. Include the parameters and the events it should emit.
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: It adds or changes an error code (`ERROR_CODES`).
        - label: It changes the public API in `definitions.ts`.
        - label: It needs a native (Android) change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you have tried, if any.
